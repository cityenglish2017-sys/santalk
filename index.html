<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>창원중앙역 어린이 관제사</title>

  <link rel="stylesheet" href="style.css?v=31">
</head>

<body>

<div id="app">

  <header class="top-bar">

    <div class="title-box">
      🚦
      <div>
        <div class="main-title">창원중앙역 어린이 관제센터</div>
        <div class="sub-title">누구 · 어디 · 어떤 일 · 왜 · 어떻게</div>
      </div>
    </div>

    <div class="score-box">
      <div>🚨 <b id="roundText">1</b>/10</div>
      <div>⭐ <b id="scoreText">0</b></div>
      <div>💬 <b id="talkText">0</b></div>
    </div>

  </header>


  <main class="station-world">

    <div class="sky-sun"></div>

    <div class="station-building">

      <div class="station-sign">
        창원중앙역
        <small>CHANGWON JUNGANG STATION</small>
      </div>

      <div class="station-windows">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="station-doors">
        <span></span>
        <span></span>
      </div>

    </div>


    <div class="board">
      <div>🚆 열차 운행 정보</div>
      <span>SRT</span>
      <b id="srtStatus">대기</b>
      <span>KTX-산천</span>
      <b id="ktxStatus">대기</b>
    </div>


    <div id="eventBadge" class="event-badge">
      🚨 새로운 사건
    </div>


    <div class="platform p1">
      <div>1번 승강장</div>
    </div>

    <div class="track t1"></div>


    <div class="platform p2">
      <div>2번 승강장</div>
    </div>

    <div class="track t2"></div>


    <div class="platform p3">
      <div>3번 승강장</div>
    </div>

    <div class="track t3"></div>


    <div id="srt" class="train srt">
      <div class="srt-nose"></div>

      <div class="srt-car">
        <b>SRT</b>
        <div class="windows">
          <i></i><i></i><i></i><i></i>
        </div>
      </div>

      <div class="srt-car">
        <div class="windows">
          <i></i><i></i><i></i><i></i>
        </div>
      </div>
    </div>


    <div id="ktx" class="train ktx">

      <div class="ktx-car">
        <b>KTX-산천</b>

        <div class="windows">
          <i></i><i></i><i></i><i></i>
        </div>
      </div>

      <div class="ktx-car">
        <div class="windows">
          <i></i><i></i><i></i><i></i>
        </div>
      </div>

      <div class="ktx-nose"></div>

    </div>


    <div id="person" class="person">
      <div id="personIcon">👦</div>
      <span id="personName">민수</span>
    </div>


    <div class="staff">
      👨‍✈️
      <span>역무원</span>
    </div>

  </main>


  <section class="game-zone">


    <div class="story-panel">

      <div class="panel-title red-title">
        🚨 현재 상황
      </div>

      <div id="storyText" class="story-text">
        상황을 준비하고 있어요.
      </div>


      <div class="panel-title">
        📻 현장 무전
      </div>

      <div id="dialogueBox" class="dialogue-box"></div>

    </div>


    <div class="question-panel">

      <div class="question-header">

        <div id="questionType" class="question-type">
          WHO · 누구?
        </div>

        <div id="questionText" class="question-text">
          누가 도움을 요청하고 있나요?
        </div>

      </div>


      <div id="choiceBox" class="choice-box"></div>


      <div class="bottom-area">

        <div class="speak-area">

          <div>
            <b>🎙️ 관제사가 직접 말해요</b>
            <span id="speakText">
              질문을 모두 해결해보세요.
            </span>
          </div>

          <button id="speakBtn" disabled>
            말했어요!
          </button>

        </div>


        <div class="next-area">

          <div>
            <b id="progressText">질문 1 / 4</b>
            <span id="feedback">
              상황을 잘 살펴보세요.
            </span>
          </div>

          <button id="nextBtn" disabled>
            다음 질문 ▶
          </button>

        </div>

      </div>

    </div>

  </section>


  <div id="finish" class="finish hidden">

    <div class="finish-card">

      <div class="trophy">🏆</div>

      <h1>오늘의 관제 업무 완료!</h1>

      <div id="result"></div>

      <button id="restartBtn">
        다시 시작하기
      </button>

    </div>

  </div>

</div>


<script src="script.js?v=31"></script>

</body>
</html>
